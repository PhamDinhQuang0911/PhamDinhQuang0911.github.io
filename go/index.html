<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>QMath — Mở liên kết</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/short-link-redirect.js?v=20261114-v1"></script>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #475569;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --btn-bg: #0284c7;
            --btn-hover: #0369a1;
            --soft: #f1f5f9;
            --danger-bg: #fef2f2;
            --danger-text: #b91c1c;
            --warn-bg: #fffbeb;
            --warn-text: #b45309;
            --info-bg: #eff6ff;
            --info-text: #1d4ed8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14111f;
                --surface: #1e1b29;
                --border: #38344d;
                --text: #f8fafc;
                --muted: #cbd5e1;
                --accent: #38bdf8;
                --accent-hover: #7dd3fc;
                --btn-bg: #0284c7;
                --btn-hover: #0369a1;
                --soft: #262335;
                --danger-bg: rgba(127, 29, 29, 0.32);
                --danger-text: #fca5a5;
                --warn-bg: rgba(120, 53, 15, 0.35);
                --warn-text: #fcd34d;
                --info-bg: rgba(30, 58, 138, 0.35);
                --info-text: #93c5fd;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 12px 32px -16px rgba(15, 23, 42, 0.16);
            opacity: 0;
            transform: translateY(4px);
            animation: gentleAppear 0.2s ease 0.18s forwards;
        }
        .card.is-visible { animation: none; opacity: 1; transform: none; }
        @keyframes gentleAppear { to { opacity: 1; transform: translateY(0); } }
        .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .brand-name { font-size: 14px; font-weight: 800; color: var(--text); text-decoration: none; }
        .badge {
            display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 700; background: var(--info-bg); color: var(--info-text);
        }
        .badge[data-state="error"] { background: var(--danger-bg); color: var(--danger-text); }
        .badge[data-state="paused"] { background: var(--warn-bg); color: var(--warn-text); }
        .title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .spinner {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2.5px solid var(--border); border-top-color: var(--accent);
            animation: spin 0.7s linear infinite; flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
        p { margin: 0; font-size: 14px; color: var(--muted); }
        .manual {
            display: none; margin-top: 16px; padding: 10px 12px; border-radius: 12px;
            background: var(--soft); font-size: 12px; color: var(--muted); word-break: break-all;
        }
        .manual a { color: var(--accent); font-weight: 600; text-decoration: none; }
        .manual a:hover { text-decoration: underline; }
        .actions { display: none; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 16px; border-radius: 12px; font-family: inherit;
            font-size: 13.5px; font-weight: 700; cursor: pointer; text-decoration: none;
            border: 1px solid transparent; transition: background-color 0.15s ease;
        }
        .btn-primary { background: var(--btn-bg); color: #ffffff; }
        .btn-primary:hover { background: var(--btn-hover); }
        .btn-secondary { background: var(--soft); color: var(--text); border-color: var(--border); }
    </style>
</head>
<body>
    <main class="card" id="redirectCard" role="main" aria-live="polite">
        <div class="brand">
            <a class="brand-name" href="/">QMath.io.vn</a>
            <span class="badge" id="redirectBadge" data-state="info">Đang mở</span>
        </div>
        <div class="title-row">
            <span class="spinner" id="redirectSpinner" aria-hidden="true"></span>
            <h1 id="redirectTitle">Đang chuyển hướng...</h1>
        </div>
        <p id="redirectDesc">Vui lòng chờ trong giây lát.</p>
        <div class="manual" id="manualWrap">
            Nếu trình duyệt chưa tự chuyển, bấm vào đây:
            <div style="margin-top:4px;"><a id="manualLink" href="/">...</a></div>
        </div>
        <div class="actions" id="redirectActions">
            <a class="btn btn-primary" href="/">Về trang chủ QMath</a>
            <a class="btn btn-secondary" href="/student.html">Cổng học sinh</a>
            <button type="button" class="btn btn-secondary" id="retryBtn" style="display:none" onclick="window.location.reload()">Thử lại</button>
        </div>
    </main>
    <script>
        (function () {
            if (!window.QMathShortLinkCore) return;
            window.QMathShortLinkCore.bootRedirectPage({
                card: document.getElementById('redirectCard'),
                badge: document.getElementById('redirectBadge'),
                spinner: document.getElementById('redirectSpinner'),
                title: document.getElementById('redirectTitle'),
                desc: document.getElementById('redirectDesc'),
                manualWrap: document.getElementById('manualWrap'),
                manualLink: document.getElementById('manualLink'),
                actions: document.getElementById('redirectActions'),
                retryBtn: document.getElementById('retryBtn')
            });
        })();
    </script>
</body>
</html>
